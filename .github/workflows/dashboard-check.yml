name: GTA mobile dashboard checks
on:
  push:
    paths:
      - 'dashboard/**'
      - 'scripts/trends.py'
      - 'scripts/demo.py'
      - 'scripts/campaign_tomo.py'
      - 'scripts/cut.py'
      - 'scripts/check.py'
      - '.devcontainer/**'
      - '.github/workflows/dashboard-check.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'scripts/trends.py'
      - 'scripts/demo.py'
      - 'scripts/campaign_tomo.py'
      - 'scripts/cut.py'
      - 'scripts/check.py'
      - '.devcontainer/**'
      - '.github/workflows/dashboard-check.yml'
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and unit tests
        run: |
          python3 -m py_compile dashboard/app.py dashboard/workflow.py dashboard/campaign_discovery.py dashboard/test_campaign_discovery.py dashboard/test_dashboard.py dashboard/test_trends.py dashboard/test_workflow.py scripts/trends.py scripts/campaign_tomo.py
          python3 -m unittest dashboard.test_dashboard dashboard.test_trends dashboard.test_workflow dashboard.test_campaign_discovery
          python3 - <<'PY'
          from pathlib import Path
          text = Path("dashboard/index.html").read_text()
          js = text.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/gta-dashboard.js").write_text(js)
          PY
          node --check /tmp/gta-dashboard.js
          bash -n .devcontainer/setup.sh .devcontainer/start.sh
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
      - name: Start dashboard and test routes
        run: |
          python3 dashboard/app.py > /tmp/gta-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/api/status -o /tmp/dashboard-status.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("/tmp/dashboard-status.json")); assert "install" in d'
          curl -fsS http://127.0.0.1:8765/ | grep -q 'GTA Clipper'
          python3 - <<'PY'
          import json, urllib.request
          root = "http://127.0.0.1:8765"
          def get(path):
              with urllib.request.urlopen(root + path, timeout=10) as result:
                  return json.load(result)
          def post(path, value):
              body = json.dumps(value).encode()
              req = urllib.request.Request(root + path, data=body,
                  headers={"Content-Type": "application/json", "Origin": root}, method="POST")
              with urllib.request.urlopen(req, timeout=10) as result:
                  return json.load(result)
          assert get("/api/campaigns") == {"campaigns": []}
          campaign = post("/api/campaigns", {
              "name": "Testcampagne", "source_url": "https://example.org/campaign",
              "rules_reviewed": True, "min_seconds": 10, "max_seconds": 40
          })["campaign"]
          assert campaign["name"] == "Testcampagne"
          assert len(get("/api/campaigns")["campaigns"]) == 1
          post("/api/posts", {"url": "https://www.youtube.com/watch?v=abcdefghijk",
              "platform": "YouTube", "state": "posted", "views": 123, "checkpoint": "12h"})
          post("/api/posts", {"url": "https://www.youtube.com/watch?v=abcdefghijk",
              "platform": "YouTube", "state": "approved", "views": 456,
              "confirmed_payout": 3, "checkpoint": "24h"})
          posts = get("/api/posts")["posts"]
          assert len(posts) == 1 and posts[0]["views"] == 456
          assert posts[0]["confirmed_payout"] == 3
          assert get("/api/liveclips")["clips"] == []
          PY
      - name: Install FFmpeg for end-to-end video test
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - name: End-to-end demo through mobile API including actual MP4 playback
        run: |
          ffmpeg -hide_banner -version | head -n 1
          mkdir -p .venv/bin
          ln -s "$(command -v python3)" .venv/bin/python
          python3 dashboard/app.py > /tmp/dashboard-demo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          root = "http://127.0.0.1:8765"
          def get(path):
              with urllib.request.urlopen(root+path, timeout=10) as response:
                  return json.load(response)
          for _ in range(15):
              try:
                  get("/api/status")
                  break
              except Exception:
                  time.sleep(0.4)
          request = urllib.request.Request(root+"/api/run", method="POST",
              data=b'{"action":"demo"}',
              headers={"Content-Type":"application/json","Origin":root})
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status==202
          end=time.monotonic()+240
          while time.monotonic()<end:
              status=get("/api/status")
              if not status["busy"] and status["task"]=="demo":
                  assert not status["failed"],status["message"]
                  assert "TEST GESLAAGD" in status["message"],status["message"]
                  break
              time.sleep(1)
          else:
              raise AssertionError("Demo action did not finish")
          jobs=get("/api/jobs")["jobs"]
          assert any(j["id"]=="demo-local" and 1 in j["clips"] for j in jobs),jobs
          output=Path("jobs/demo-local/edits/clip_1.mp4")
          assert output.is_file() and output.stat().st_size>10000
          request=urllib.request.Request(root+"/video/demo-local/clip_1.mp4",headers={"Range":"bytes=0-1023"})
          with urllib.request.urlopen(request,timeout=20) as response:
              assert response.status==206
              assert "inline" in response.headers["Content-Disposition"]
              assert len(response.read())==1024
          with urllib.request.urlopen(root+"/download/demo-local/clip_1.mp4",timeout=20) as response:
              assert response.status==200
              assert "attachment" in response.headers["Content-Disposition"]
              assert response.headers["Content-Type"]=="video/mp4"
              assert int(response.headers["Content-Length"])==output.stat().st_size
          print("Mobile API -> validated MP4 -> preview and download verified:",output.stat().st_size,"bytes")
          PY
